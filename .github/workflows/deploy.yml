name: Deploy to EC2
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build client
        working-directory: client
        run: npm ci && npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Upload build
        run: rsync -az --delete client/dist/ ${{ secrets.USER }}@${{ secrets.HOST }}:/tmp/dist/

      - name: Publish and restart
        run: |
          ssh ${{ secrets.USER }}@${{ secrets.HOST }} '
            sudo rsync -a --delete /tmp/dist/ /var/www/html/ &&
            cd ~/MANNA_RECLAIM && git pull &&
            cd server && npm ci --omit=dev &&
            pm2 restart manna-api --update-env
          '
