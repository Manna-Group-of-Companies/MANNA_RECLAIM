<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Matches the top of --bar, so the Android status bar above the header
         is the same colour as the header rather than a white strip over it. -->
    <meta name="theme-color" content="#1a232f" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- One SVG covers every browser that draws a tab. iOS is the exception:
         Safari ignores an SVG here and, with nothing to fall back to, puts a
         screenshot of the page on the home screen - which matters because this
         is installed to the home screen on the floor phones. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Manna Production Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
